name: Artifacts and Conditional Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Generate Build Output
        run: |
          mkdir build_output
          echo "Build Artifact Version 1.0 - Generated by ${{ github.actor }}" > build_output/app-v1.txt

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-app-build
          path: build_output/app-v1.txt
  
  deploy-job:
    needs: build-job
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: web-app-build
      - name: Verify Downloaded file
        run: |
          echo "Reading downloaded artifact conten:"
          cat app-v1.txt

